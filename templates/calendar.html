
{% extends "base.html" %}
{% block content %}
<div class="panel">
  <div class="panel-title"><div><h2>Renewal Calendar</h2><p>Simple chronological renewal view</p></div></div>
  <div class="timeline">
  {% for s in subs %}
    <div class="timeline-row"><div class="datebox">{{s.renewal_date}}</div><div><b>{{s.name}}</b><p>{{s.amount|money}} · {{s.billing_cycle}}</p></div></div>
  {% endfor %}
  </div>
</div>
{% endblock %}
